name: Prepare ERSYA MEBEL source

on:
  push:
    paths:
      - 'ERSYA-MEBEL-V24.2.4-FINAL-READY-DEPLOY.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-check:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract final source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="ERSYA-MEBEL-V24.2.4-FINAL-READY-DEPLOY.zip"
          ZIP_PATH=".source-package/$ZIP_NAME"
          mkdir -p .source-package

          if [ -f "$ZIP_NAME" ]; then
            mv "$ZIP_NAME" "$ZIP_PATH"
          fi

          if [ ! -s "$ZIP_PATH" ]; then
            echo "ZIP final tidak ditemukan. Unggah ZIP ke folder utama repository."
            exit 0
          fi

          unzip -oq "$ZIP_PATH" -d .
          test -f package.json
          test -f netlify.toml
          test -f public/index.html
          test -f public/admin.html
          test -f public/manifest.webmanifest
          test -f netlify/functions/analyze-product-image.js

      - name: Run full verification
        run: npm run build

      - name: Save extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ERSYA MEBEL V24.2.4 source [skip ci]" || echo "No source changes to save."
          git push
